<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página no encontrada — Alexis Artaza</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/styles.css">
  <script>
    try {
      var savedTheme = localStorage.getItem("theme");
      if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
    } catch (e) {}
  </script>
</head>
<body>
  <header class="site-header">
    <nav class="nav container" aria-label="Principal">
      <a class="nav__logo" href="/" aria-label="Solo Codin, ir al inicio">
        <span class="nav__mark" aria-hidden="true"><i class="bi bi-code-slash"></i></span>
        Solo Codin
      </a>
    </nav>
  </header>

  <main class="not-found">
    <p class="not-found__code">Error 404</p>
    <h1 class="section__title">Esta página no existe</h1>
    <p class="section__lead">Puede que el link esté mal escrito o que la página se haya movido.</p>
    <a class="btn btn--primary" href="/">
      <i class="bi bi-arrow-left" aria-hidden="true"></i>
      Volver al inicio
    </a>
  </main>
</body>
</html>
